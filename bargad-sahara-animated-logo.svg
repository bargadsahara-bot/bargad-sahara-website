<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="बरगद सहारा | बुढ़ापे का सहारा — Animated Official Heritage Seal Logo">
  <title>बरगद सहारा | बुढ़ापे का सहारा (Bargad Sahara Official Animated SVG Seal)</title>
  <desc>Living Banyan Tree Heritage Seal representing 100 Elders and 6,000 Years of Wisdom, with breathing golden sun aura, swaying banyan canopy, hanging aerial prop roots, and rotating heritage seal rings.</desc>

  <defs>
    <radialGradient id="khadiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F6F1E2"/>
    </radialGradient>

    <radialGradient id="sunAuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4A261" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#E9C46A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F4F24"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#7F4F24"/>
    </linearGradient>

    <path id="seal-arc-top-hi" d="M 62,200 A 138,138 0 1,1 338,200" fill="none"/>
    <path id="seal-arc-bot-en" d="M 57,200 A 143,143 0 0,0 343,200" fill="none"/>
    <path id="seal-arc-bot-sub" d="M 36,200 A 164,164 0 0,0 364,200" fill="none"/>
    <path id="seal-arc-inner-motto" d="M 104,200 A 96,96 0 0,0 296,200" fill="none"/>

    <style>
      .seal-dashed-ring {
        transform-origin: 200px 200px;
        animation: spinSlow 48s linear infinite;
      }
      .sun-rays-group {
        transform-origin: 200px 166px;
        animation: spinRays 32s linear infinite;
      }
      .canopy-outer {
        transform-origin: 200px 185px;
        animation: canopyBreeze 5.5s ease-in-out infinite;
      }
      .canopy-inner {
        transform-origin: 200px 175px;
        animation: canopyBreezeInner 4.2s ease-in-out infinite;
      }
      .aerial-root-left {
        transform-origin: 135px 178px;
        animation: rootSwayLeft 3.8s ease-in-out infinite;
      }
      .aerial-root-left-2 {
        transform-origin: 147px 184px;
        animation: rootSwayRight 4.4s ease-in-out infinite;
      }
      .aerial-root-right {
        transform-origin: 265px 178px;
        animation: rootSwayRight 3.9s ease-in-out infinite;
      }
      .aerial-root-right-2 {
        transform-origin: 253px 184px;
        animation: rootSwayLeft 4.6s ease-in-out infinite;
      }
      .gen-star-1 { animation: starPulse 2.8s ease-in-out infinite; }
      .gen-star-2 { animation: starPulse 2.8s ease-in-out 0.9s infinite; }
      .gen-star-3 { animation: starPulse 2.8s ease-in-out 1.8s infinite; }
      .horizon-roots {
        stroke-dasharray: 40;
        animation: rootEnergy 6s linear infinite;
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRays {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes canopyBreeze {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(1.3deg) scale(1.018); }
      }
      @keyframes canopyBreezeInner {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        50% { transform: rotate(-1.2deg) translateY(-2px); }
      }
      @keyframes rootSwayLeft {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3.2deg); }
      }
      @keyframes rootSwayRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3.2deg); }
      }
      @keyframes starPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.25); }
      }
      @keyframes rootEnergy {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- 1. Outer Khadi Medallion Base & Deep Banyan Border -->
  <circle cx="200" cy="200" r="190" fill="url(#khadiGrad)" stroke="#1B4332" stroke-width="10"/>

  <!-- 2. Rotating Heritage Dashed Ring (SMIL + CSS Dual Animation) -->
  <circle class="seal-dashed-ring" cx="200" cy="200" r="178" fill="none" stroke="url(#goldRingGrad)" stroke-width="2.4" stroke-dasharray="7,5">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="48s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. Inner Sanctuary Circle -->
  <circle cx="200" cy="200" r="116" fill="#FFFDF9" stroke="#1B4332" stroke-width="3.5"/>
  <circle cx="200" cy="200" r="109" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-dasharray="3,3">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- 4. Breathing Golden Sun Aura & Rotating Sun Rays (सुनहरी सुबह) -->
  <circle cx="200" cy="164" r="64" fill="url(#sunAuraGrad)">
    <animate attributeName="r" values="56;68;56" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="166" r="54" fill="#E9C46A" opacity="0.26">
    <animate attributeName="r" values="52;59;52" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g class="sun-rays-group" opacity="0.38" stroke="#D4A373" stroke-width="1.6" stroke-linecap="round">
    <line x1="200" y1="92" x2="200" y2="104"/>
    <line x1="148" y1="114" x2="157" y2="123"/>
    <line x1="252" y1="114" x2="243" y2="123"/>
    <line x1="126" y1="166" x2="138" y2="166"/>
    <line x1="274" y1="166" x2="262" y2="166"/>
    <animateTransform attributeName="transform" type="rotate" from="0 200 166" to="360 200 166" dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- 5. Living Banyan Canopy (बरगद की घनी छांव — Gentle Breeze Animation) -->
  <g class="canopy-outer">
    <path d="M114,168 C100,142 122,112 149,117 C161,97 183,90 200,94 C217,90 239,97 251,117 C278,112 300,142 286,168 C292,183 271,192 253,186 C232,194 168,194 147,186 C129,192 108,183 114,168 Z" fill="#1B4332"/>
    <animateTransform attributeName="transform" type="rotate" values="0 200 185; 1.2 200 185; -0.8 200 185; 0 200 185" dur="5.5s" repeatCount="indefinite"/>
  </g>

  <g class="canopy-inner">
    <path d="M129,159 C123,141 141,124 161,126 C174,110 226,110 239,126 C259,124 277,141 271,159 C255,171 145,171 129,159 Z" fill="#2D6A4F"/>
    <!-- 3 Golden Orbs representing 3 Generations (87 yrs • 44 yrs • 10 yrs) -->
    <circle class="gen-star-1" cx="200" cy="114" r="5.5" fill="#E9C46A">
      <animate attributeName="r" values="4.8;6.6;4.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="gen-star-2" cx="184" cy="121" r="4" fill="#E9C46A">
      <animate attributeName="r" values="3.5;5.1;3.5" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="gen-star-3" cx="216" cy="121" r="4" fill="#E9C46A">
      <animate attributeName="r" values="3.5;5.1;3.5" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 6. Swaying Aerial Prop Roots (बरगद की सहारा देती जटाएं) -->
  <g class="aerial-root-left">
    <line x1="135" y1="178" x2="135" y2="225" stroke="#7F4F24" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="135" cy="225" r="2.2" fill="#E9C46A">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="aerial-root-left-2">
    <line x1="147" y1="184" x2="147" y2="216" stroke="#7F4F24" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="14,4"/>
  </g>
  <g class="aerial-root-right">
    <line x1="265" y1="178" x2="265" y2="225" stroke="#7F4F24" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="265" cy="225" r="2.2" fill="#E9C46A">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="aerial-root-right-2">
    <line x1="253" y1="184" x2="253" y2="216" stroke="#7F4F24" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="14,4"/>
  </g>

  <!-- 7. Ancient Banyan Trunk & Deep Babiyar Roots -->
  <path d="M165,244 C177,226 187,204 191,173 L200,157 L209,173 C213,204 223,226 235,244" fill="none" stroke="#7F4F24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M147,233 C165,240 181,226 189,198" fill="none" stroke="#9C6644" stroke-width="6" stroke-linecap="round"/>
  <path d="M253,233 C235,240 219,226 211,198" fill="none" stroke="#9C6644" stroke-width="6" stroke-linecap="round"/>
  <path d="M129,248 Q200,237 271,248" fill="none" stroke="#1B4332" stroke-width="4" stroke-linecap="round"/>
  <path class="horizon-roots" d="M186,245 Q168,257 150,261" fill="none" stroke="#7F4F24" stroke-width="3" stroke-linecap="round"/>
  <path class="horizon-roots" d="M200,243 L200,263" fill="none" stroke="#7F4F24" stroke-width="3" stroke-linecap="round"/>
  <path class="horizon-roots" d="M214,245 Q232,257 250,261" fill="none" stroke="#7F4F24" stroke-width="3" stroke-linecap="round"/>

  <!-- 8. Precision Curved Bilingual Typography -->
  <text font-size="12.5" font-weight="800" fill="#7F4F24" font-family="Noto Sans Devanagari, Segoe UI, sans-serif" letter-spacing="0.5">
    <textPath href="#seal-arc-inner-motto" startOffset="50%" text-anchor="middle">अनुभव • सम्मान • सहारा</textPath>
  </text>

  <!-- Glowing Side Heritage Diamonds -->
  <circle cx="53" cy="200" r="4" fill="#D4A373">
    <animate attributeName="r" values="3.2;5;3.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="347" cy="200" r="4" fill="#D4A373">
    <animate attributeName="r" values="3.2;5;3.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text font-size="25" font-weight="800" fill="#1B4332" font-family="Noto Sans Devanagari, Segoe UI, sans-serif" letter-spacing="1">
    <textPath href="#seal-arc-top-hi" startOffset="50%" text-anchor="middle">• बरगद सहारा •</textPath>
  </text>
  <text font-size="15.5" font-weight="800" fill="#1B4332" font-family="Segoe UI, sans-serif" letter-spacing="2.5">
    <textPath href="#seal-arc-bot-en" startOffset="50%" text-anchor="middle">BARGAD SAHARA</textPath>
  </text>
  <text font-size="13" font-weight="800" fill="#7F4F24" font-family="Noto Sans Devanagari, Segoe UI, sans-serif" letter-spacing="1">
    <textPath href="#seal-arc-bot-sub" startOffset="50%" text-anchor="middle">• बुढ़ापे का सहारा •</textPath>
  </text>
</svg>
